# pyghidra-mcp 0.1.6: every exposed tool is read-only. No project management,
# arbitrary scripts, file writes, or verifier feedback enters the agent lane.
version: '1.0'
upstream: pyghidra-mcp
upstream_version: '0.1.6'
tools:
  - decompile_function
  - list_cross_references
  - list_exports
  - list_imports
  - list_project_binaries
  - list_project_program_info
  - search_functions_by_name
  - search_symbols_by_name
