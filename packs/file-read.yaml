family: file-read
version: 1
call_shapes:
- id: path_out_len
  roles: [path, out_ptr, len_ptr]
  return_width: 32
  comparison: return_output
variants:
  std:
    oracle: read_std
inputs:
  fixed: ['', a, hello, 'hello world']
  fixed_hex: ['00', '00ff0041', '0a0d0a', '']
  random:
    count: 64
    max_len: 4096
    seed: 20261018
near_miss: [read_truncated_last_byte, read_extra_byte, read_length_off_by_one, read_always_minus_one]
