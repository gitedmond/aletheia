[project]
name = "aletheia-re"
version = "0.1.0"
description = "Evidence-backed verification of reverse engineering claims"
requires-python = ">=3.12,<3.13"
license = "MIT"
readme = "README.md"
dependencies = ["pydantic==2.14.1", "typer==0.27.3", "PyYAML==6.0.3"]

[project.scripts]
aletheia = "aletheia.cli:main"
alth = "aletheia.cli:main"

[build-system]
requires = ["uv_build==0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "aletheia"
module-root = ""

[dependency-groups]
dev = ["ruff==0.17.0", "pyright[nodejs]==1.1.414", "nodejs-wheel-binaries==24.19.0", "pytest==9.1.1", "jsonschema==4.26.0"]
corpus = ["pyelftools==0.33", "capstone==5.0.9"]
analysis = ["pyelftools==0.33", "unicorn==2.1.4", "pyghidra==2.2.1", "flare-capa==9.4.0"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
typeCheckingMode = "strict"
include = ["aletheia"]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = ["slow: expensive full pipeline checks", "integration: requires pinned Docker images"]
